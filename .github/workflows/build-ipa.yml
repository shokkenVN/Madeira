name: Build Madeira IPA

# Builds an unsigned IPA (for SideStore / AltStore, which re-sign on install).
# Based on docs/BUILDING.md in the repo. Steps marked UNVERIFIED are ones the
# project itself says have never been re-run from a clean checkout.

on:
  workflow_dispatch:
    inputs:
      rebuild_pe:
        description: "Rebuild ARM64EC PE modules (FEX xtajit64.dll + Wine ntdll.dll) instead of using the tracked ones"
        type: boolean
        default: false
      fetch_vcruntime:
        description: "Download Microsoft's VC++ runtime into the bundle (see warning in the step; keep the repo private or don't share the artifact)"
        type: boolean
        default: false

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_MINGW_TAG: "20260421"
  LLVM_MINGW_SHA256: "bd85a3975723815cef28dbbd2ca2cb0c926f6b348a12a0453f39f7af273cb3f7"
  # docs/BUILDING.md pins this llvm-project commit; build/dxmt-ios/README.md says
  # "LLVM 15.0.7". The two disagree. If airconv fails to compile, try the other.
  LLVM_REF: "8dfdcc7b7"

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install build tools
        run: |
          brew install cmake ninja meson bison flex ccache pkg-config ldid
          # Wine's configure needs bison >= 3; macOS ships 2.3
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          # dxmt-ios compiles Metal shaders; newer Xcode needs the toolchain downloaded
          xcrun -sdk macosx metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain

      # ---------- toolchains (git-ignored, not in the repo) ----------
      - name: Fetch llvm-mingw
        run: |
          mkdir -p toolchains
          F="llvm-mingw-${LLVM_MINGW_TAG}-ucrt-macos-universal.tar.xz"
          curl -fL -o "$F" "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_TAG}/$F"
          echo "${LLVM_MINGW_SHA256}  $F" | shasum -a 256 -c -
          tar -xJf "$F" -C toolchains/
          rm "$F"
          echo "$PWD/toolchains/llvm-mingw-${LLVM_MINGW_TAG}-ucrt-macos-universal/bin" >> "$GITHUB_PATH"

      - name: Cache LLVM for iOS
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: |
            toolchains/llvm-project
            toolchains/llvm-host-build
            toolchains/llvm-ios-build
          key: llvm-ios-${{ env.LLVM_REF }}-v1

      - name: Build LLVM for iOS (slow; cached after first run)
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchains/llvm-project
          curl -fL "https://github.com/llvm/llvm-project/archive/${LLVM_REF}.tar.gz" \
            | tar -xz -C toolchains/llvm-project --strip-components=1 '*/llvm/*' '*/cmake/*'

          # dxmt-ios/README.md: use -dead_strip (Apple ld) instead of --gc-sections on iOS
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("toolchains/llvm-project/llvm/cmake/modules/AddLLVM.cmake")
          s = p.read_text()
          i = s.index("function(add_link_opts")
          j = s.index('MATCHES "Darwin"', i)
          p.write_text(s[:j] + 'MATCHES "Darwin|iOS"' + s[j + len('MATCHES "Darwin"'):])
          PY

          # host stage: llvm-tblgen only
          cmake -S toolchains/llvm-project/llvm -B toolchains/llvm-host-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DLLVM_TARGETS_TO_BUILD= -DLLVM_INCLUDE_TESTS=Off
          cmake --build toolchains/llvm-host-build --target llvm-tblgen

          # iOS stage: static libs only (flags from docs/BUILDING.md)
          cmake -S toolchains/llvm-project/llvm -B toolchains/llvm-ios-build -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_HOST_TRIPLE=arm64-apple-ios17.0 -DLLVM_DEFAULT_TARGET_TRIPLE=arm64-apple-ios17.0 \
            -DLLVM_TARGET_ARCH=host -DLLVM_TARGETS_TO_BUILD= -DLLVM_ENABLE_PROJECTS= \
            -DLLVM_BUILD_TOOLS=Off -DLLVM_BUILD_UTILS=Off -DLLVM_INCLUDE_TESTS=Off \
            -DLLVM_INCLUDE_EXAMPLES=Off -DLLVM_INCLUDE_BENCHMARKS=Off \
            -DLLVM_ENABLE_ZLIB=Off -DLLVM_ENABLE_TERMINFO=Off -DLLVM_ENABLE_LIBXML2=Off \
            -DLLVM_TABLEGEN="$PWD/toolchains/llvm-host-build/bin/llvm-tblgen"
          cmake --build toolchains/llvm-ios-build

      # ---------- native chains ----------
      # GnuTLS/GMP/Nettle archives are tracked in app/Madeira, so build/gnutls-ios is skipped.

      - name: FEX (iOS static libs)
        run: bash build/fex-ios/build.sh

      - name: Wine macOS tree (headers/config for the unix-side builds)
        # UNVERIFIED: the repo never documents how wine/build-macos was configured.
        # This is a best guess; adjust the configure flags if it fails.
        run: |
          mkdir -p wine/build-macos
          cd wine/build-macos
          ../configure --without-x --disable-tests
          make -j"$(sysctl -n hw.ncpu)"

      - name: Wine unix-side libs (wineserver, ntdll_unix, win32u_unix)
        run: |
          bash build/wineserver/build.sh
          bash build/ntdll-unix/build.sh
          bash build/win32u-unix/build.sh

      - name: DXMT unix side + combined archive
        run: |
          bash build/dxmt-ios/build.sh   # only warns (exit 0) that the combined archive is absent; we build it next
          xcrun -sdk iphoneos libtool -static -o build/dxmt-ios/libdxmt_combined.a \
            build/dxmt-ios/obj/*.o toolchains/llvm-ios-build/lib/*.a
          cp build/dxmt-ios/libdxmt_combined.a app/Madeira/libdxmt_combined.a

      - name: Rebuild ARM64EC PE modules (optional)
        if: ${{ inputs.rebuild_pe }}
        # UNVERIFIED from a clean checkout per docs/BUILDING.md
        run: |
          bash build/fex-arm64ec/build.sh
          bash build/wine-pe/build-ntdll.sh

      # ---------- bundle inputs ----------
      - name: Microsoft VC++ runtime
        run: |
          D=app/Madeira/x86_64-vcruntime
          mkdir -p "$D"   # the Xcode project references this folder; it must exist
          if [ "${{ inputs.fetch_vcruntime }}" = "true" ]; then
            echo "::warning::These DLLs are Microsoft's, not GPL. Don't publish an IPA containing them from a public repo."
            brew install sevenzip
            curl -fL -o /tmp/vc_redist.x64.exe https://aka.ms/vs/17/release/vc_redist.x64.exe
            7zz x /tmp/vc_redist.x64.exe -o/tmp/vcredist -y
            mkdir -p /tmp/vccab
            find /tmp/vcredist -iname '*.cab' -exec 7zz x {} -o/tmp/vccab -y \;
            for n in concrt140 msvcp140 msvcp140_1 msvcp140_2 msvcp140_atomic_wait msvcp140_codecvt_ids \
                     vcamp140 vccorlib140 vcomp140 vcruntime140 vcruntime140_1 vcruntime140_threads; do
              f=$(find /tmp/vccab -iname "${n}.dll*" | head -n1)
              [ -n "$f" ] && cp "$f" "$D/${n}.dll" || echo "::warning::${n}.dll not found in redistributable"
            done
          fi
          ls -l "$D"

      - name: Stage licences (Xcode fails if stale)
        run: bash build/stage-licenses.sh

      - name: Preflight - required link inputs
        run: |
          missing=0
          for f in \
            FEX/build-ios/FEXCore/Source/libFEXCore.a FEX/build-ios/FEXCore/Source/libFEXCore_Base.a \
            FEX/build-ios/FEXCore/Source/libJemallocLibs.a FEX/build-ios/External/fmt/libfmt.a \
            FEX/build-ios/External/cephes/libcephes_128bit.a \
            FEX/build-ios/External/xxhash/cmake_unofficial/libxxhash.a \
            FEX/build-ios/External/SoftFloat-3e/libsoftfloat_3e.a \
            app/Madeira/libwineserver.a app/Madeira/libntdll_unix.a app/Madeira/libwin32u_unix.a \
            app/Madeira/libdxmt_combined.a app/Madeira/libgnutls.a app/Madeira/libnettle.a \
            app/Madeira/libhogweed.a app/Madeira/libgmp.a; do
            [ -f "$f" ] || { echo "::error::missing $f"; missing=1; }
          done
          exit $missing

      # ---------- app ----------
      - name: xcodebuild (Debug, unsigned)
        # Debug is intentional: docs/BUILDING.md says Release builds have crashed the guest.
        run: |
          xcodebuild -project app/Madeira.xcodeproj -scheme Madeira \
            -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            build

      - name: Package IPA
        run: |
          APP=$(find build/dd/Build/Products -maxdepth 2 -name Madeira.app -type d | head -n1)
          [ -n "$APP" ] || { echo "::error::Madeira.app not found"; exit 1; }
          # Unsigned builds carry no entitlements; embed them with a fake signature so
          # SideStore/AltStore can read and preserve them (JIT, increased-memory-limit).
          ldid -Sapp/Madeira/Madeira.entitlements "$APP/Madeira"
          rm -rf ipa && mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../Madeira-unsigned.ipa Payload)
          ls -lh Madeira-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-unsigned-ipa
          path: Madeira-unsigned.ipa
          retention-days: 14
